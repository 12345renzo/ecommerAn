<div class="w-full flex flex-col gap-4 p-4 border rounded-lg shadow-md group hover:-translate-y-1 transition-all cursor-pointer">
  <img [src]="coleccion()?.imagen" class="w-full h-48 object-cover rounded-md transition-all group-hover:scale-102">
  <div class="flex flex-col gap-2 m-3">
    <p class="text-lg font-semibold text-black">{{ coleccion()?.titulo }}</p>
    <p class="text-sm text-foreground/70">{{ coleccion()?.descripcion }}</p>
  </div>
  <div class="flex flex-row gap-2 justify-between text-[#1a95ad] font-semibold m-3">
    <p>{{ coleccion()?.total }} productos</p>
    <svg lucideArrowRight class="w-6 h-6 transition-all group-hover:translate-x-1"></svg>
  </div>
</div>
