<div class="sticky top-0 z-40 glass border-b border-white/10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <button [routerLink]="'/'" class="flex items-center gap-2 shrink-0 cursor-pointer">
        <img src="/ori.png" alt="Logo de la Empresa" class="w-32 h-fit object-cover" />
      </button>

      @if (datosUsuario.useri()?.user; as user) {
        <div class="flex items-center gap-4">
          <div class="flex items-center gap-3">
            <img
              [src]="avatarUrl()"
              alt="Foto de perfil"
              class="w-11 h-11 rounded-full object-cover border-2 border-[#1a95ad] shadow-[0_0_10px_#1a95ad]"
            />
            <div class="flex flex-col leading-tight min-w-0">
              <p class="text-sm font-bold text-black truncate max-w-40">{{ user.fullName }}</p>
              <p class="flex items-center gap-1 text-[12px] text-[#1a95ad] font-medium">
                <svg lucideCrown class="w-3 h-3"></svg>
                Administrador
              </p>
            </div>
          </div>

          <button
            [routerLink]="'/'"
            class="icon-neumorphic cursor-pointer"
            aria-label="Volver al inicio"
          >
            <svg lucideHouse class="w-5 h-5"></svg>
          </button>

          <button
            (click)="cerrarSesion()"
            class="icon-neumorphic cursor-pointer"
            aria-label="Cerrar sesión"
          >
            <svg lucideLogOut class="w-5 h-5"></svg>
          </button>
        </div>
      }
    </div>
  </div>
</div>
